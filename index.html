<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #262b36;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --accent: #5eead4;
    --accent-dim: #14b8a6;
    --danger: #f87171;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --card-border: #e2e6ec;
      --text: #171a21;
      --text-dim: #5b6472;
      --accent: #0d9488;
      --accent-dim: #0f766e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  nav.toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
  }
  nav.toolbar button {
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text-dim);
    padding: 10px 6px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.toolbar button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .section-panel.hidden { display: none; }
  .row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .row > .card {
    flex: 1;
    min-width: 180px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .streak-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    justify-content: center;
  }
  .streak-item .streak-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .streak-item .streak-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .streak-item .streak-value.zero {
    color: var(--text-dim);
  }
  .today-date {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .today-result {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .today-result .time {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .today-result .label {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .today-result .time.skip {
    font-size: 1.5rem;
    color: var(--text-dim);
  }
  .entry-form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .field input {
    width: 76px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #04211d;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--card-border);
    padding: 6px 10px;
    font-weight: 500;
  }
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .status.error { color: var(--danger); }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendar-header h2 {
    font-size: 1rem;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }
  .grid .dow {
    font-size: 0.7rem;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
  }
  .day.empty { cursor: default; }
  .day.has-entry {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
    font-weight: 600;
  }
  .day.skipped {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    color: var(--text-dim);
    text-decoration: line-through;
  }
  .day.is-today {
    border-color: var(--accent);
  }
  .day:not(.empty):hover {
    background: var(--card-border);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .modal .date { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .modal .time { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .modal .entry-form { justify-content: center; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Workout Tracker</h1>
    <p>Track your daily workouts</p>
  </header>

  <nav class="toolbar" id="toolbar">
    <button class="active" data-section="plank">Plank</button>
  </nav>

  <div class="section-panel" data-section-panel="plank">
    <div class="row">
      <section class="card" id="today-card">
        <div class="today-date" id="today-date-label">Loading...</div>
        <div id="today-content">Connecting...</div>
        <div class="status" id="today-status"></div>
      </section>

      <section class="card streak-card">
        <div class="streak-item">
          <div class="streak-label">Current streak</div>
          <div class="streak-value" id="current-streak">-</div>
        </div>
        <div class="streak-item">
          <div class="streak-label">Best streak</div>
          <div class="streak-value" id="best-streak">-</div>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="calendar-header">
        <button class="secondary" id="prev-month">&larr;</button>
        <h2 id="month-label"></h2>
        <button class="secondary" id="next-month">&rarr;</button>
      </div>
      <div class="grid" id="calendar-grid"></div>
    </section>
  </div>
</main>

<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal">
    <div class="date" id="modal-date"></div>
    <div id="modal-body"></div>
    <div class="status" id="modal-status"></div>
    <div class="modal-actions">
      <button class="secondary" id="modal-close">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbbZvg_Cp7o1fIE6rn1yU1VzzmuzD4rHw",
  authDomain: "workout-tracker-janesh.firebaseapp.com",
  projectId: "workout-tracker-janesh",
  storageBucket: "workout-tracker-janesh.firebasestorage.app",
  messagingSenderId: "1031985808077",
  appId: "1:1031985808077:web:7df8e6273e63d42c5e9f84"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ENTRIES_COLLECTION = "plankEntries";

function dateId(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatSeconds(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  if (m === 0) return `${s}s`;
  return `${m}m ${s}s`;
}

function formatLongDate(date) {
  return date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

const todayDateLabel = document.getElementById("today-date-label");
const todayContent = document.getElementById("today-content");
const todayStatus = document.getElementById("today-status");

const today = new Date();
const todayId = dateId(today);
todayDateLabel.textContent = formatLongDate(today);

let entriesCache = {}; // dateId -> { seconds, skipped }

async function fetchAllEntries() {
  const snap = await getDocs(collection(db, ENTRIES_COLLECTION));
  snap.forEach((d) => {
    const data = d.data();
    entriesCache[d.id] = { seconds: data.seconds || 0, skipped: !!data.skipped };
  });
}

async function saveEntry(id, { seconds, skipped }) {
  await setDoc(doc(db, ENTRIES_COLLECTION, id), {
    date: id,
    seconds,
    skipped: !!skipped,
    updatedAt: new Date().toISOString()
  });
  entriesCache[id] = { seconds, skipped: !!skipped };
}

function isHit(entry) {
  return !!entry && !entry.skipped && entry.seconds > 0;
}

function formatDays(n) {
  return `${n} day${n === 1 ? "" : "s"}`;
}

function computeCurrentStreak() {
  const cursor = new Date(today);
  if (!entriesCache[todayId]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  let streak = 0;
  while (isHit(entriesCache[dateId(cursor)])) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeBestStreak() {
  const hitDates = Object.keys(entriesCache).filter((id) => isHit(entriesCache[id])).sort();
  let best = 0;
  let run = 0;
  let prevId = null;
  for (const id of hitDates) {
    if (prevId) {
      const prev = new Date(prevId + "T00:00:00");
      const cur = new Date(id + "T00:00:00");
      const diffDays = Math.round((cur - prev) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    prevId = id;
    if (run > best) best = run;
  }
  return best;
}

const currentStreakEl = document.getElementById("current-streak");
const bestStreakEl = document.getElementById("best-streak");

function renderStreaks() {
  const current = computeCurrentStreak();
  const best = Math.max(computeBestStreak(), current);
  currentStreakEl.textContent = formatDays(current);
  currentStreakEl.classList.toggle("zero", current === 0);
  bestStreakEl.textContent = formatDays(best);
  bestStreakEl.classList.toggle("zero", best === 0);
}

function entryFormHtml({ idPrefix, existingSeconds, submitLabel }) {
  const mins = existingSeconds !== undefined ? Math.floor(existingSeconds / 60) : 0;
  const secs = existingSeconds !== undefined ? existingSeconds % 60 : 0;
  return `
    <form class="entry-form" id="${idPrefix}-form">
      <div class="field">
        <label for="${idPrefix}-mins">Minutes</label>
        <input type="number" id="${idPrefix}-mins" min="0" value="${mins}" inputmode="numeric">
      </div>
      <div class="field">
        <label for="${idPrefix}-secs">Seconds</label>
        <input type="number" id="${idPrefix}-secs" min="0" max="59" value="${secs}" inputmode="numeric">
      </div>
      <button type="submit">${submitLabel}</button>
    </form>
  `;
}

function renderTodayForm(existingSeconds) {
  const label = existingSeconds !== undefined ? "Update today's plank" : "Save today's plank";
  todayContent.innerHTML = entryFormHtml({ idPrefix: "today", existingSeconds, submitLabel: label }) +
    `<button type="button" class="secondary" id="skip-today-btn" style="margin-top:10px;">Didn't do a plank today</button>`;
  document.getElementById("today-form").addEventListener("submit", (e) => onSubmitEntry(e, existingSeconds !== undefined));
  document.getElementById("skip-today-btn").addEventListener("click", onSkipToday);
}

function renderTodayResult(seconds) {
  todayContent.innerHTML = `
    <div class="today-result">
      <div class="time">${formatSeconds(seconds)}</div>
      <div class="label">logged for today</div>
    </div>
    <button class="secondary" id="edit-today-btn">Edit</button>
  `;
  document.getElementById("edit-today-btn").addEventListener("click", () => renderTodayForm(seconds));
}

function renderTodaySkipped() {
  todayContent.innerHTML = `
    <div class="today-result">
      <div class="time skip">No plank today</div>
    </div>
    <button class="secondary" id="edit-today-btn">Log a time instead</button>
  `;
  document.getElementById("edit-today-btn").addEventListener("click", () => renderTodayForm());
}

async function onSubmitEntry(e, isUpdate) {
  e.preventDefault();
  const mins = parseInt(document.getElementById("today-mins").value, 10) || 0;
  const secs = parseInt(document.getElementById("today-secs").value, 10) || 0;
  const totalSeconds = mins * 60 + secs;

  if (totalSeconds <= 0) {
    todayStatus.textContent = "Enter a time greater than 0.";
    todayStatus.classList.add("error");
    return;
  }

  todayStatus.textContent = "Saving...";
  todayStatus.classList.remove("error");

  try {
    await saveEntry(todayId, { seconds: totalSeconds, skipped: false });
    renderTodayResult(totalSeconds);
    todayStatus.textContent = isUpdate ? "Updated!" : "Saved!";
    renderCalendar();
    renderStreaks();
  } catch (err) {
    todayStatus.textContent = "Failed to save: " + err.message;
    todayStatus.classList.add("error");
  }
}

async function onSkipToday() {
  todayStatus.textContent = "Saving...";
  todayStatus.classList.remove("error");
  try {
    await saveEntry(todayId, { seconds: 0, skipped: true });
    renderTodaySkipped();
    todayStatus.textContent = "Saved!";
    renderCalendar();
    renderStreaks();
  } catch (err) {
    todayStatus.textContent = "Failed to save: " + err.message;
    todayStatus.classList.add("error");
  }
}

function loadToday() {
  const entry = entriesCache[todayId];
  if (!entry) {
    renderTodayForm();
  } else if (entry.skipped) {
    renderTodaySkipped();
  } else {
    renderTodayResult(entry.seconds);
  }
}

// --- Calendar ---
const monthLabel = document.getElementById("month-label");
const calendarGrid = document.getElementById("calendar-grid");
const prevMonthBtn = document.getElementById("prev-month");
const nextMonthBtn = document.getElementById("next-month");
const modalBackdrop = document.getElementById("modal-backdrop");
const modalDate = document.getElementById("modal-date");
const modalBody = document.getElementById("modal-body");
const modalStatus = document.getElementById("modal-status");
document.getElementById("modal-close").addEventListener("click", () => modalBackdrop.classList.add("hidden"));
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.add("hidden"); });

let viewYear = today.getFullYear();
let viewMonth = today.getMonth(); // 0-indexed

const DOW = ["S", "M", "T", "W", "T", "F", "S"];

function renderCalendar() {
  monthLabel.textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

  calendarGrid.innerHTML = "";
  DOW.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    calendarGrid.appendChild(el);
  });

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    calendarGrid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(viewYear, viewMonth, day);
    const id = dateId(date);
    const el = document.createElement("div");
    el.className = "day";
    if (id === todayId) el.classList.add("is-today");
    const entry = entriesCache[id];
    if (entry) el.classList.add(entry.skipped ? "skipped" : "has-entry");
    el.textContent = day;
    el.addEventListener("click", () => openDayModal(date, id));
    calendarGrid.appendChild(el);
  }
}

function openDayModal(date, id) {
  modalDate.textContent = formatLongDate(date);
  modalStatus.textContent = "";
  modalStatus.classList.remove("error");

  if (id > todayId) {
    modalBody.innerHTML = `<div class="status">Can't log a plank for a future date.</div>`;
    modalBackdrop.classList.remove("hidden");
    return;
  }

  const entry = entriesCache[id];
  const label = entry ? "Update" : "Save";
  const statusLabel = !entry
    ? "No entry yet"
    : entry.skipped
      ? "Marked as no plank this day"
      : `Logged: ${formatSeconds(entry.seconds)}`;

  modalBody.innerHTML = `
    <div class="status" style="margin-top:0;">${statusLabel}</div>
    ${entryFormHtml({ idPrefix: "modal", existingSeconds: entry && !entry.skipped ? entry.seconds : undefined, submitLabel: label })}
    <button type="button" class="secondary" id="modal-skip-btn">No plank this day</button>
  `;

  document.getElementById("modal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mins = parseInt(document.getElementById("modal-mins").value, 10) || 0;
    const secs = parseInt(document.getElementById("modal-secs").value, 10) || 0;
    const totalSeconds = mins * 60 + secs;

    if (totalSeconds <= 0) {
      modalStatus.textContent = "Enter a time greater than 0.";
      modalStatus.classList.add("error");
      return;
    }

    modalStatus.textContent = "Saving...";
    modalStatus.classList.remove("error");

    try {
      await saveEntry(id, { seconds: totalSeconds, skipped: false });
      if (id === todayId) renderTodayResult(totalSeconds);
      renderCalendar();
      renderStreaks();
      openDayModal(date, id);
      modalStatus.textContent = "Saved!";
    } catch (err) {
      modalStatus.textContent = "Failed to save: " + err.message;
      modalStatus.classList.add("error");
    }
  });

  document.getElementById("modal-skip-btn").addEventListener("click", async () => {
    modalStatus.textContent = "Saving...";
    modalStatus.classList.remove("error");
    try {
      await saveEntry(id, { seconds: 0, skipped: true });
      if (id === todayId) renderTodaySkipped();
      renderCalendar();
      renderStreaks();
      openDayModal(date, id);
      modalStatus.textContent = "Saved!";
    } catch (err) {
      modalStatus.textContent = "Failed to save: " + err.message;
      modalStatus.classList.add("error");
    }
  });

  modalBackdrop.classList.remove("hidden");
}

prevMonthBtn.addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});
nextMonthBtn.addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

// --- Toolbar ---
document.getElementById("toolbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-section]");
  if (!btn) return;
  document.querySelectorAll("#toolbar button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll("[data-section-panel]").forEach((panel) => {
    panel.classList.toggle("hidden", panel.dataset.sectionPanel !== btn.dataset.section);
  });
});

// --- Boot ---
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    await fetchAllEntries();
    loadToday();
    renderCalendar();
    renderStreaks();
  } catch (err) {
    todayContent.textContent = "Could not load entries.";
    todayStatus.textContent = err.message;
    todayStatus.classList.add("error");
  }
});

signInAnonymously(auth).catch((err) => {
  todayContent.textContent = "Sign-in failed.";
  todayStatus.textContent = err.message;
  todayStatus.classList.add("error");
});
</script>
</body>
</html>
