<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #262b36;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --accent: #5eead4;
    --accent-dim: #14b8a6;
    --danger: #f87171;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --card-border: #e2e6ec;
      --text: #171a21;
      --text-dim: #5b6472;
      --accent: #0d9488;
      --accent-dim: #0f766e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  nav.toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
  }
  nav.toolbar button {
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text-dim);
    padding: 10px 6px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.toolbar button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  nav.toolbar button.add-section-btn {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    padding: 10px 12px;
    margin-left: auto;
  }
  .section-panel.hidden { display: none; }
  .row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .row > .main-card {
    flex: 1.6;
    min-width: 240px;
  }
  .side-column {
    flex: 1;
    min-width: 180px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .side-column .card {
    margin-bottom: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .streak-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .streak-item .streak-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .streak-item .streak-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .streak-item .streak-value.zero {
    color: var(--text-dim);
  }
  .leaderboard-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .leaderboard-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .leaderboard-list .rank {
    color: var(--text-dim);
    width: 16px;
    font-weight: 600;
  }
  .leaderboard-list .lb-date {
    flex: 1;
    color: var(--text-dim);
  }
  .leaderboard-list .lb-time {
    font-weight: 700;
    color: var(--accent);
  }
  .leaderboard-list .empty {
    color: var(--text-dim);
  }
  .attempts-list {
    list-style: none;
    margin: 10px 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .attempts-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .attempts-list .remove-attempt {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1rem;
    padding: 0 4px;
    cursor: pointer;
  }
  .attempts-list .remove-attempt:hover {
    color: var(--danger);
  }
  .today-date {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .today-result {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .today-result .time {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .today-result .label {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .today-result .time.skip {
    font-size: 1.5rem;
    color: var(--text-dim);
  }
  .entry-form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .field input {
    width: 76px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #04211d;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--card-border);
    padding: 6px 10px;
    font-weight: 500;
  }
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .status.error { color: var(--danger); }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendar-header h2 {
    font-size: 1rem;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }
  .grid .dow {
    font-size: 0.7rem;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
  }
  .day.empty { cursor: default; }
  .day.has-entry {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
    font-weight: 600;
  }
  .day.skipped {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    color: var(--text-dim);
    text-decoration: line-through;
  }
  .day.is-today {
    border-color: var(--accent);
  }
  .day:not(.empty):hover {
    background: var(--card-border);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .modal .date { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .modal .time { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .modal .entry-form { justify-content: center; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: center; }
  #new-section-backdrop .modal { max-width: 360px; text-align: left; }
  #new-section-backdrop .date { text-align: center; }
  #new-section-title {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  .type-choice {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
  }
  .type-choice label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .type-choice .hint {
    color: var(--text-dim);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Workout Tracker</h1>
    <p>Track your daily workouts</p>
  </header>

  <nav class="toolbar" id="toolbar"></nav>

  <div id="sections-container"></div>
</main>

<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal">
    <div class="date" id="modal-date"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="secondary" id="modal-close">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="new-section-backdrop">
  <div class="modal">
    <div class="date">New section</div>
    <form id="new-section-form">
      <div class="field" style="width:100%;">
        <label for="new-section-title">Title</label>
        <input type="text" id="new-section-title" placeholder="e.g. Squats" style="width:100%;" autocomplete="off">
      </div>
      <div class="field" style="width:100%; margin-top:14px; align-items:flex-start;">
        <label>Type</label>
        <div class="type-choice">
          <label>
            <input type="radio" name="new-section-type" value="time" checked>
            Time-based <span class="hint">(like Plank)</span>
          </label>
          <label>
            <input type="radio" name="new-section-type" value="reps">
            Rep-based <span class="hint">(like Pushups)</span>
          </label>
        </div>
      </div>
      <div class="status" id="new-section-status"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button type="button" class="secondary" id="new-section-cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbbZvg_Cp7o1fIE6rn1yU1VzzmuzD4rHw",
  authDomain: "workout-tracker-janesh.firebaseapp.com",
  projectId: "workout-tracker-janesh",
  storageBucket: "workout-tracker-janesh.firebasestorage.app",
  messagingSenderId: "1031985808077",
  appId: "1:1031985808077:web:7df8e6273e63d42c5e9f84"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const BUILTIN_SECTIONS = [
  { id: "plank", title: "Plank", type: "time" },
  { id: "pushups", title: "Pushups", type: "reps" }
];

function dateId(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatSeconds(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  if (m === 0) return `${s}s`;
  return `${m}m ${s}s`;
}

function formatLongDate(date) {
  return date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

function formatShortDate(id) {
  return new Date(id + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatDays(n) {
  return `${n} day${n === 1 ? "" : "s"}`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const today = new Date();
const todayId = dateId(today);
const DOW = ["S", "M", "T", "W", "T", "F", "S"];

let sections = [];
const caches = {}; // section.id -> { dateId -> entry }
const viewState = {}; // section.id -> { year, month }
let activeSectionId = null;

function collectionNameFor(section) {
  return `${section.id}Entries`;
}

// --- Data access ---
async function fetchAllEntriesFor(section) {
  const snap = await getDocs(collection(db, collectionNameFor(section)));
  const cache = {};
  snap.forEach((d) => {
    const data = d.data();
    if (section.type === "time") {
      // Back-compat: older docs stored a single top-level `seconds` field instead of `attempts`.
      const attempts = Array.isArray(data.attempts)
        ? data.attempts
        : data.seconds ? [{ seconds: data.seconds, loggedAt: data.updatedAt || null }] : [];
      const seconds = attempts.length ? Math.max(...attempts.map((a) => a.seconds)) : 0;
      cache[d.id] = { seconds, skipped: !!data.skipped, attempts };
    } else {
      const attempts = Array.isArray(data.attempts) ? data.attempts : [];
      const total = attempts.reduce((sum, a) => sum + (a.count || 0), 0);
      cache[d.id] = { total, attempts };
    }
  });
  caches[section.id] = cache;
}

async function saveDayFor(section, id, payload) {
  if (section.type === "time") {
    const { attempts, skipped } = payload;
    const seconds = attempts.length ? Math.max(...attempts.map((a) => a.seconds)) : 0;
    await setDoc(doc(db, collectionNameFor(section), id), {
      date: id,
      attempts,
      skipped: !!skipped,
      updatedAt: new Date().toISOString()
    });
    caches[section.id][id] = { seconds, skipped: !!skipped, attempts };
  } else {
    const { attempts } = payload;
    const total = attempts.reduce((sum, a) => sum + (a.count || 0), 0);
    await setDoc(doc(db, collectionNameFor(section), id), {
      date: id,
      attempts,
      updatedAt: new Date().toISOString()
    });
    caches[section.id][id] = { total, attempts };
  }
}

function addAttemptFor(section, id, value) {
  const existing = caches[section.id][id];
  if (section.type === "time") {
    const attempts = [...(existing?.attempts || []), { seconds: value, loggedAt: new Date().toISOString() }];
    return saveDayFor(section, id, { attempts, skipped: false });
  }
  const attempts = [...(existing?.attempts || []), { count: value, loggedAt: new Date().toISOString() }];
  return saveDayFor(section, id, { attempts });
}

function removeAttemptFor(section, id, index) {
  const attempts = (caches[section.id][id]?.attempts || []).filter((_, i) => i !== index);
  if (section.type === "time") return saveDayFor(section, id, { attempts, skipped: false });
  return saveDayFor(section, id, { attempts });
}

function markSkippedFor(section, id) {
  return saveDayFor(section, id, { attempts: [], skipped: true });
}

// --- Streaks (time sections only) ---
function isHit(entry) {
  return !!entry && !entry.skipped && entry.seconds > 0;
}

function computeCurrentStreak(section) {
  const cache = caches[section.id];
  const cursor = new Date(today);
  if (!cache[todayId]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  let streak = 0;
  while (isHit(cache[dateId(cursor)])) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeBestStreak(section) {
  const cache = caches[section.id];
  const hitDates = Object.keys(cache).filter((id) => isHit(cache[id])).sort();
  let best = 0;
  let run = 0;
  let prevId = null;
  for (const id of hitDates) {
    if (prevId) {
      const prev = new Date(prevId + "T00:00:00");
      const cur = new Date(id + "T00:00:00");
      const diffDays = Math.round((cur - prev) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    prevId = id;
    if (run > best) best = run;
  }
  return best;
}

function renderStreaksFor(section, panel) {
  const current = computeCurrentStreak(section);
  const best = Math.max(computeBestStreak(section), current);
  const currentEl = panel.querySelector('[data-role="current-streak"]');
  const bestEl = panel.querySelector('[data-role="best-streak"]');
  currentEl.textContent = formatDays(current);
  currentEl.classList.toggle("zero", current === 0);
  bestEl.textContent = formatDays(best);
  bestEl.classList.toggle("zero", best === 0);
}

// --- Leaderboard ---
function renderLeaderboardFor(section, panel) {
  const cache = caches[section.id];
  const listEl = panel.querySelector('[data-role="leaderboard-list"]');
  const top = section.type === "time"
    ? Object.entries(cache)
        .filter(([, entry]) => isHit(entry))
        .map(([id, entry]) => ({ id, label: formatSeconds(entry.seconds), value: entry.seconds }))
        .sort((a, b) => b.value - a.value)
        .slice(0, 5)
    : Object.entries(cache)
        .filter(([, entry]) => entry.total > 0)
        .map(([id, entry]) => ({ id, label: `${entry.total} reps`, value: entry.total }))
        .sort((a, b) => b.value - a.value)
        .slice(0, 5);

  if (top.length === 0) {
    listEl.innerHTML = `<li class="empty">No entries yet</li>`;
    return;
  }

  listEl.innerHTML = top.map((entry, i) => `
    <li>
      <span class="rank">${i + 1}</span>
      <span class="lb-date">${formatShortDate(entry.id)}</span>
      <span class="lb-time">${entry.label}</span>
    </li>
  `).join("");
}

// --- Day editor (today card + modal) ---
function attemptsListHtml(section, attempts) {
  if (!attempts.length) return "";
  return `
    <ul class="attempts-list">
      ${attempts.map((a, i) => `
        <li>
          <span>${section.type === "time" ? formatSeconds(a.seconds) : `${a.count} reps`}</span>
          <button type="button" class="remove-attempt" data-index="${i}" aria-label="Remove entry">&times;</button>
        </li>
      `).join("")}
    </ul>
  `;
}

function dayEditorHtml(section, entry, { skipLabel }) {
  const hasAttempts = entry.attempts.length > 0;
  if (section.type === "time") {
    return `
      ${hasAttempts ? `
        <div class="today-result">
          <div class="time">${formatSeconds(entry.seconds)}</div>
          <div class="label">best today</div>
        </div>
      ` : ""}
      ${entry.skipped ? `<div class="time skip">No ${escapeHtml(section.title.toLowerCase())} logged</div>` : ""}
      ${attemptsListHtml(section, entry.attempts)}
      <form class="entry-form day-form">
        <div class="field">
          <label>Minutes</label>
          <input type="number" class="mins-input" min="0" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>Seconds</label>
          <input type="number" class="secs-input" min="0" max="59" value="0" inputmode="numeric">
        </div>
        <button type="submit">${hasAttempts ? "Add another" : "Save"}</button>
      </form>
      <div class="status" data-role="form-status"></div>
      ${!hasAttempts ? `<button type="button" class="secondary skip-btn" style="margin-top:10px;">${skipLabel}</button>` : ""}
    `;
  }

  return `
    ${hasAttempts ? `
      <div class="today-result">
        <div class="time">${entry.total}</div>
        <div class="label">reps today</div>
      </div>
    ` : ""}
    ${attemptsListHtml(section, entry.attempts)}
    <form class="entry-form day-form">
      <div class="field">
        <label>Reps</label>
        <input type="number" class="reps-input" min="0" value="0" inputmode="numeric">
      </div>
      <button type="submit">${hasAttempts ? "Add another set" : "Save"}</button>
    </form>
    <div class="status" data-role="form-status"></div>
  `;
}

function wireDayEditor(section, container, id, onChange) {
  const statusEl = container.querySelector('[data-role="form-status"]');

  const form = container.querySelector(".day-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      let value;
      if (section.type === "time") {
        const mins = parseInt(container.querySelector(".mins-input").value, 10) || 0;
        const secs = parseInt(container.querySelector(".secs-input").value, 10) || 0;
        value = mins * 60 + secs;
        if (value <= 0) {
          statusEl.textContent = "Enter a time greater than 0.";
          statusEl.classList.add("error");
          return;
        }
      } else {
        value = parseInt(container.querySelector(".reps-input").value, 10) || 0;
        if (value <= 0) {
          statusEl.textContent = "Enter a rep count greater than 0.";
          statusEl.classList.add("error");
          return;
        }
      }

      statusEl.textContent = "Saving...";
      statusEl.classList.remove("error");
      try {
        await addAttemptFor(section, id, value);
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to save: " + err.message;
        statusEl.classList.add("error");
      }
    });
  }

  container.querySelectorAll(".remove-attempt").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await removeAttemptFor(section, id, parseInt(btn.dataset.index, 10));
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to remove: " + err.message;
        statusEl.classList.add("error");
      }
    });
  });

  const skipBtn = container.querySelector(".skip-btn");
  if (skipBtn) {
    skipBtn.addEventListener("click", async () => {
      statusEl.textContent = "Saving...";
      statusEl.classList.remove("error");
      try {
        await markSkippedFor(section, id);
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to save: " + err.message;
        statusEl.classList.add("error");
      }
    });
  }
}

function renderTodayFor(section, panel) {
  const entry = caches[section.id][todayId] || (section.type === "time" ? { seconds: 0, skipped: false, attempts: [] } : { total: 0, attempts: [] });
  const contentEl = panel.querySelector('[data-role="today-content"]');
  contentEl.innerHTML = dayEditorHtml(section, entry, { skipLabel: `Didn't do ${escapeHtml(section.title.toLowerCase())} today` });
  wireDayEditor(section, contentEl, todayId, () => refreshSection(section));
}

// --- Calendar ---
function renderCalendarFor(section, panel) {
  const vs = viewState[section.id];
  const monthLabel = panel.querySelector('[data-role="month-label"]');
  const grid = panel.querySelector('[data-role="calendar-grid"]');

  monthLabel.textContent = new Date(vs.year, vs.month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

  grid.innerHTML = "";
  DOW.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(vs.year, vs.month, 1).getDay();
  const daysInMonth = new Date(vs.year, vs.month + 1, 0).getDate();
  const cache = caches[section.id];

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(vs.year, vs.month, day);
    const id = dateId(date);
    const el = document.createElement("div");
    el.className = "day";
    if (id === todayId) el.classList.add("is-today");
    const entry = cache[id];
    if (section.type === "time") {
      if (entry) el.classList.add(entry.skipped ? "skipped" : "has-entry");
    } else if (entry && entry.total > 0) {
      el.classList.add("has-entry");
    }
    el.textContent = day;
    el.addEventListener("click", () => openDayModal(section, date, id));
    grid.appendChild(el);
  }
}

// --- Modal (view/edit any day) ---
const modalBackdrop = document.getElementById("modal-backdrop");
const modalDate = document.getElementById("modal-date");
const modalBody = document.getElementById("modal-body");
document.getElementById("modal-close").addEventListener("click", () => modalBackdrop.classList.add("hidden"));
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.add("hidden"); });

function openDayModal(section, date, id) {
  modalDate.textContent = formatLongDate(date);

  if (id > todayId) {
    modalBody.innerHTML = `<div class="status">Can't log entries for a future date.</div>`;
    modalBackdrop.classList.remove("hidden");
    return;
  }

  const entry = caches[section.id][id] || (section.type === "time" ? { seconds: 0, skipped: false, attempts: [] } : { total: 0, attempts: [] });
  modalBody.innerHTML = dayEditorHtml(section, entry, { skipLabel: `No ${escapeHtml(section.title.toLowerCase())} this day` });
  wireDayEditor(section, modalBody, id, () => {
    refreshSection(section);
    openDayModal(section, date, id);
  });

  modalBackdrop.classList.remove("hidden");
}

// --- Section panels ---
function sectionPanelHtml(section, isActive) {
  return `
    <div class="section-panel${isActive ? "" : " hidden"}" data-section-panel="${section.id}">
      <div class="row">
        <section class="card main-card">
          <div class="today-date">${formatLongDate(today)}</div>
          <div data-role="today-content">Connecting...</div>
        </section>

        <div class="side-column">
          ${section.type === "time" ? `
            <section class="card streak-card">
              <div class="streak-item">
                <div class="streak-label">Current streak</div>
                <div class="streak-value" data-role="current-streak">-</div>
              </div>
              <div class="streak-item">
                <div class="streak-label">Best streak</div>
                <div class="streak-value" data-role="best-streak">-</div>
              </div>
            </section>
          ` : ""}

          <section class="card leaderboard-card">
            <div class="card-title">Leaderboard</div>
            <ol class="leaderboard-list" data-role="leaderboard-list"></ol>
          </section>
        </div>
      </div>

      <section class="card">
        <div class="calendar-header">
          <button class="secondary" data-role="prev-month">&larr;</button>
          <h2 data-role="month-label"></h2>
          <button class="secondary" data-role="next-month">&rarr;</button>
        </div>
        <div class="grid" data-role="calendar-grid"></div>
      </section>
    </div>
  `;
}

function panelEl(sectionId) {
  return document.querySelector(`[data-section-panel="${sectionId}"]`);
}

function createSectionPanel(section, isActive) {
  const wrapper = document.createElement("div");
  wrapper.innerHTML = sectionPanelHtml(section, isActive).trim();
  const panel = wrapper.firstElementChild;
  document.getElementById("sections-container").appendChild(panel);

  viewState[section.id] = { year: today.getFullYear(), month: today.getMonth() };
  panel.querySelector('[data-role="prev-month"]').addEventListener("click", () => {
    const vs = viewState[section.id];
    vs.month--;
    if (vs.month < 0) { vs.month = 11; vs.year--; }
    renderCalendarFor(section, panel);
  });
  panel.querySelector('[data-role="next-month"]').addEventListener("click", () => {
    const vs = viewState[section.id];
    vs.month++;
    if (vs.month > 11) { vs.month = 0; vs.year++; }
    renderCalendarFor(section, panel);
  });
}

function refreshSection(section) {
  const panel = panelEl(section.id);
  if (!panel) return;
  renderTodayFor(section, panel);
  renderCalendarFor(section, panel);
  if (section.type === "time") renderStreaksFor(section, panel);
  renderLeaderboardFor(section, panel);
}

// --- Toolbar ---
const toolbarEl = document.getElementById("toolbar");

function renderToolbar() {
  toolbarEl.innerHTML = sections.map((s) => `
    <button class="${s.id === activeSectionId ? "active" : ""}" data-section="${s.id}">${escapeHtml(s.title)}</button>
  `).join("") + `<button type="button" class="add-section-btn" id="add-section-btn" aria-label="Add section">+</button>`;
}

function setActiveSection(id) {
  activeSectionId = id;
  toolbarEl.querySelectorAll("button[data-section]").forEach((b) => {
    b.classList.toggle("active", b.dataset.section === id);
  });
  document.querySelectorAll("[data-section-panel]").forEach((panel) => {
    panel.classList.toggle("hidden", panel.dataset.sectionPanel !== id);
  });
}

toolbarEl.addEventListener("click", (e) => {
  if (e.target.closest("#add-section-btn")) {
    openNewSectionModal();
    return;
  }
  const btn = e.target.closest("button[data-section]");
  if (!btn) return;
  setActiveSection(btn.dataset.section);
});

// --- New section creation ---
function slugify(title) {
  return title.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section";
}

function uniqueSectionId(base) {
  const existing = new Set(sections.map((s) => s.id));
  if (!existing.has(base)) return base;
  let n = 2;
  while (existing.has(`${base}-${n}`)) n++;
  return `${base}-${n}`;
}

async function saveCustomSections() {
  const builtinIds = new Set(BUILTIN_SECTIONS.map((s) => s.id));
  const custom = sections.filter((s) => !builtinIds.has(s.id)).map((s) => ({ id: s.id, title: s.title, type: s.type }));
  await setDoc(doc(db, "meta", "sections"), { list: custom });
}

const newSectionBackdrop = document.getElementById("new-section-backdrop");
const newSectionForm = document.getElementById("new-section-form");
const newSectionTitle = document.getElementById("new-section-title");
const newSectionStatus = document.getElementById("new-section-status");

function openNewSectionModal() {
  newSectionForm.reset();
  newSectionStatus.textContent = "";
  newSectionStatus.classList.remove("error");
  newSectionBackdrop.classList.remove("hidden");
  newSectionTitle.focus();
}

function closeNewSectionModal() {
  newSectionBackdrop.classList.add("hidden");
}

document.getElementById("new-section-cancel").addEventListener("click", closeNewSectionModal);
newSectionBackdrop.addEventListener("click", (e) => { if (e.target === newSectionBackdrop) closeNewSectionModal(); });

newSectionForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = newSectionTitle.value.trim();
  const type = newSectionForm.querySelector('input[name="new-section-type"]:checked').value;

  if (!title) {
    newSectionStatus.textContent = "Give it a title.";
    newSectionStatus.classList.add("error");
    return;
  }

  newSectionStatus.textContent = "Creating...";
  newSectionStatus.classList.remove("error");

  const id = uniqueSectionId(slugify(title));
  const section = { id, title, type };

  try {
    sections.push(section);
    await saveCustomSections();
    caches[id] = {};
    renderToolbar();
    createSectionPanel(section, false);
    await fetchAllEntriesFor(section);
    refreshSection(section);
    setActiveSection(id);
    closeNewSectionModal();
  } catch (err) {
    sections = sections.filter((s) => s.id !== id);
    newSectionStatus.textContent = "Failed to create: " + err.message;
    newSectionStatus.classList.add("error");
  }
});

// --- Boot ---
async function loadSections() {
  sections = [...BUILTIN_SECTIONS];
  try {
    const snap = await getDoc(doc(db, "meta", "sections"));
    if (snap.exists()) {
      const list = snap.data().list;
      if (Array.isArray(list)) {
        const existingIds = new Set(sections.map((s) => s.id));
        list.forEach((s) => {
          if (s && s.id && s.title && (s.type === "time" || s.type === "reps") && !existingIds.has(s.id)) {
            sections.push({ id: s.id, title: s.title, type: s.type });
            existingIds.add(s.id);
          }
        });
      }
    }
  } catch (err) {
    // No custom sections yet, or not readable — fall back to built-ins.
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    await loadSections();
    activeSectionId = sections[0].id;
    renderToolbar();
    sections.forEach((section, i) => {
      caches[section.id] = {};
      createSectionPanel(section, i === 0);
    });
    await Promise.all(sections.map((section) => fetchAllEntriesFor(section)));
    sections.forEach((section) => refreshSection(section));
  } catch (err) {
    document.getElementById("sections-container").innerHTML = `<div class="status error">Could not load entries: ${err.message}</div>`;
  }
});

signInAnonymously(auth).catch((err) => {
  document.getElementById("sections-container").innerHTML = `<div class="status error">Sign-in failed: ${err.message}</div>`;
});
</script>
