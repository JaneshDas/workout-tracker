<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #262b36;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --accent: #5eead4;
    --accent-dim: #14b8a6;
    --danger: #f87171;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --card-border: #e2e6ec;
      --text: #171a21;
      --text-dim: #5b6472;
      --accent: #0d9488;
      --accent-dim: #0f766e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  nav.toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
  }
  nav.toolbar button {
    background: transparent;
    border: none;
    border-radius: 0;
    color: var(--text-dim);
    padding: 10px 6px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.toolbar button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .section-panel.hidden { display: none; }
  .row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .row > .main-card {
    flex: 1.6;
    min-width: 240px;
  }
  .side-column {
    flex: 1;
    min-width: 180px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .side-column .card {
    margin-bottom: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .streak-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .streak-item .streak-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .streak-item .streak-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .streak-item .streak-value.zero {
    color: var(--text-dim);
  }
  .leaderboard-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .leaderboard-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .leaderboard-list .rank {
    color: var(--text-dim);
    width: 16px;
    font-weight: 600;
  }
  .leaderboard-list .lb-date {
    flex: 1;
    color: var(--text-dim);
  }
  .leaderboard-list .lb-time {
    font-weight: 700;
    color: var(--accent);
  }
  .leaderboard-list .empty {
    color: var(--text-dim);
  }
  .attempts-list {
    list-style: none;
    margin: 10px 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .attempts-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .attempts-list .remove-attempt {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1rem;
    padding: 0 4px;
    cursor: pointer;
  }
  .attempts-list .remove-attempt:hover {
    color: var(--danger);
  }
  .today-date {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .today-result {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .today-result .time {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .today-result .label {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .today-result .time.skip {
    font-size: 1.5rem;
    color: var(--text-dim);
  }
  .entry-form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .field input {
    width: 76px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #04211d;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--card-border);
    padding: 6px 10px;
    font-weight: 500;
  }
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .status.error { color: var(--danger); }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendar-header h2 {
    font-size: 1rem;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }
  .grid .dow {
    font-size: 0.7rem;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
  }
  .day.empty { cursor: default; }
  .day.has-entry {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
    font-weight: 600;
  }
  .day.skipped {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    color: var(--text-dim);
    text-decoration: line-through;
  }
  .day.is-today {
    border-color: var(--accent);
  }
  .day:not(.empty):hover {
    background: var(--card-border);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .modal .date { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .modal .time { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .modal .entry-form { justify-content: center; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; justify-content: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Workout Tracker</h1>
    <p>Track your daily workouts</p>
  </header>

  <nav class="toolbar" id="toolbar">
    <button class="active" data-section="plank">Plank</button>
    <button data-section="pushups">Pushups</button>
  </nav>

  <div class="section-panel" data-section-panel="plank">
    <div class="row">
      <section class="card main-card" id="today-card">
        <div class="today-date" id="today-date-label">Loading...</div>
        <div id="today-content">Connecting...</div>
      </section>

      <div class="side-column">
        <section class="card streak-card">
          <div class="streak-item">
            <div class="streak-label">Current streak</div>
            <div class="streak-value" id="current-streak">-</div>
          </div>
          <div class="streak-item">
            <div class="streak-label">Best streak</div>
            <div class="streak-value" id="best-streak">-</div>
          </div>
        </section>

        <section class="card leaderboard-card">
          <div class="card-title">Leaderboard</div>
          <ol class="leaderboard-list" id="leaderboard-list"></ol>
        </section>
      </div>
    </div>

    <section class="card">
      <div class="calendar-header">
        <button class="secondary" id="prev-month">&larr;</button>
        <h2 id="month-label"></h2>
        <button class="secondary" id="next-month">&rarr;</button>
      </div>
      <div class="grid" id="calendar-grid"></div>
    </section>
  </div>

  <div class="section-panel hidden" data-section-panel="pushups">
    <div class="row">
      <section class="card main-card" id="pushup-today-card">
        <div class="today-date" id="pushup-today-date-label">Loading...</div>
        <div id="pushup-today-content">Connecting...</div>
      </section>

      <div class="side-column">
        <section class="card leaderboard-card">
          <div class="card-title">Leaderboard</div>
          <ol class="leaderboard-list" id="pushup-leaderboard-list"></ol>
        </section>
      </div>
    </div>

    <section class="card">
      <div class="calendar-header">
        <button class="secondary" id="pushup-prev-month">&larr;</button>
        <h2 id="pushup-month-label"></h2>
        <button class="secondary" id="pushup-next-month">&rarr;</button>
      </div>
      <div class="grid" id="pushup-calendar-grid"></div>
    </section>
  </div>
</main>

<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal">
    <div class="date" id="modal-date"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="secondary" id="modal-close">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbbZvg_Cp7o1fIE6rn1yU1VzzmuzD4rHw",
  authDomain: "workout-tracker-janesh.firebaseapp.com",
  projectId: "workout-tracker-janesh",
  storageBucket: "workout-tracker-janesh.firebasestorage.app",
  messagingSenderId: "1031985808077",
  appId: "1:1031985808077:web:7df8e6273e63d42c5e9f84"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ENTRIES_COLLECTION = "plankEntries";
const PUSHUP_COLLECTION = "pushupEntries";

function dateId(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatSeconds(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  if (m === 0) return `${s}s`;
  return `${m}m ${s}s`;
}

function formatLongDate(date) {
  return date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

const todayDateLabel = document.getElementById("today-date-label");
const todayContent = document.getElementById("today-content");

const today = new Date();
const todayId = dateId(today);
todayDateLabel.textContent = formatLongDate(today);

let entriesCache = {}; // dateId -> { seconds: bestAttemptSeconds, skipped, attempts: [{seconds, loggedAt}] }

async function fetchAllEntries() {
  const snap = await getDocs(collection(db, ENTRIES_COLLECTION));
  snap.forEach((d) => {
    const data = d.data();
    // Back-compat: older docs stored a single top-level `seconds` field instead of `attempts`.
    const attempts = Array.isArray(data.attempts)
      ? data.attempts
      : data.seconds ? [{ seconds: data.seconds, loggedAt: data.updatedAt || null }] : [];
    const seconds = attempts.length ? Math.max(...attempts.map((a) => a.seconds)) : 0;
    entriesCache[d.id] = { seconds, skipped: !!data.skipped, attempts };
  });
}

async function saveDay(id, { attempts, skipped }) {
  const seconds = attempts.length ? Math.max(...attempts.map((a) => a.seconds)) : 0;
  await setDoc(doc(db, ENTRIES_COLLECTION, id), {
    date: id,
    attempts,
    skipped: !!skipped,
    updatedAt: new Date().toISOString()
  });
  entriesCache[id] = { seconds, skipped: !!skipped, attempts };
}

function addAttempt(id, seconds) {
  const existing = entriesCache[id];
  const attempts = [...(existing?.attempts || []), { seconds, loggedAt: new Date().toISOString() }];
  return saveDay(id, { attempts, skipped: false });
}

function removeAttempt(id, index) {
  const attempts = (entriesCache[id]?.attempts || []).filter((_, i) => i !== index);
  return saveDay(id, { attempts, skipped: false });
}

function markSkipped(id) {
  return saveDay(id, { attempts: [], skipped: true });
}

let pushupCache = {}; // dateId -> { total, attempts: [{count, loggedAt}] }

async function fetchAllPushups() {
  const snap = await getDocs(collection(db, PUSHUP_COLLECTION));
  snap.forEach((d) => {
    const data = d.data();
    const attempts = Array.isArray(data.attempts) ? data.attempts : [];
    const total = attempts.reduce((sum, a) => sum + (a.count || 0), 0);
    pushupCache[d.id] = { total, attempts };
  });
}

async function savePushupDay(id, attempts) {
  const total = attempts.reduce((sum, a) => sum + (a.count || 0), 0);
  await setDoc(doc(db, PUSHUP_COLLECTION, id), {
    date: id,
    attempts,
    updatedAt: new Date().toISOString()
  });
  pushupCache[id] = { total, attempts };
}

function addPushupAttempt(id, count) {
  const attempts = [...(pushupCache[id]?.attempts || []), { count, loggedAt: new Date().toISOString() }];
  return savePushupDay(id, attempts);
}

function removePushupAttempt(id, index) {
  const attempts = (pushupCache[id]?.attempts || []).filter((_, i) => i !== index);
  return savePushupDay(id, attempts);
}

function isHit(entry) {
  return !!entry && !entry.skipped && entry.seconds > 0;
}

function formatDays(n) {
  return `${n} day${n === 1 ? "" : "s"}`;
}

function computeCurrentStreak() {
  const cursor = new Date(today);
  if (!entriesCache[todayId]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  let streak = 0;
  while (isHit(entriesCache[dateId(cursor)])) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeBestStreak() {
  const hitDates = Object.keys(entriesCache).filter((id) => isHit(entriesCache[id])).sort();
  let best = 0;
  let run = 0;
  let prevId = null;
  for (const id of hitDates) {
    if (prevId) {
      const prev = new Date(prevId + "T00:00:00");
      const cur = new Date(id + "T00:00:00");
      const diffDays = Math.round((cur - prev) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    prevId = id;
    if (run > best) best = run;
  }
  return best;
}

const currentStreakEl = document.getElementById("current-streak");
const bestStreakEl = document.getElementById("best-streak");

function renderStreaks() {
  const current = computeCurrentStreak();
  const best = Math.max(computeBestStreak(), current);
  currentStreakEl.textContent = formatDays(current);
  currentStreakEl.classList.toggle("zero", current === 0);
  bestStreakEl.textContent = formatDays(best);
  bestStreakEl.classList.toggle("zero", best === 0);
}

function formatShortDate(id) {
  return new Date(id + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const leaderboardListEl = document.getElementById("leaderboard-list");

function renderLeaderboard() {
  const top = Object.entries(entriesCache)
    .filter(([, entry]) => isHit(entry))
    .map(([id, entry]) => ({ id, seconds: entry.seconds }))
    .sort((a, b) => b.seconds - a.seconds)
    .slice(0, 5);

  if (top.length === 0) {
    leaderboardListEl.innerHTML = `<li class="empty">No entries yet</li>`;
    return;
  }

  leaderboardListEl.innerHTML = top.map((entry, i) => `
    <li>
      <span class="rank">${i + 1}</span>
      <span class="lb-date">${formatShortDate(entry.id)}</span>
      <span class="lb-time">${formatSeconds(entry.seconds)}</span>
    </li>
  `).join("");
}

const pushupLeaderboardListEl = document.getElementById("pushup-leaderboard-list");

function renderPushupLeaderboard() {
  const top = Object.entries(pushupCache)
    .filter(([, entry]) => entry.total > 0)
    .map(([id, entry]) => ({ id, total: entry.total }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 5);

  if (top.length === 0) {
    pushupLeaderboardListEl.innerHTML = `<li class="empty">No entries yet</li>`;
    return;
  }

  pushupLeaderboardListEl.innerHTML = top.map((entry, i) => `
    <li>
      <span class="rank">${i + 1}</span>
      <span class="lb-date">${formatShortDate(entry.id)}</span>
      <span class="lb-time">${entry.total} reps</span>
    </li>
  `).join("");
}

function pushupAttemptsListHtml(attempts) {
  if (!attempts.length) return "";
  return `
    <ul class="attempts-list">
      ${attempts.map((a, i) => `
        <li>
          <span>${a.count} reps</span>
          <button type="button" class="remove-pushup" data-index="${i}" aria-label="Remove set">&times;</button>
        </li>
      `).join("")}
    </ul>
  `;
}

function pushupDayEditorHtml(entry) {
  const hasAttempts = entry.attempts.length > 0;
  return `
    ${hasAttempts ? `
      <div class="today-result">
        <div class="time">${entry.total}</div>
        <div class="label">reps today</div>
      </div>
    ` : ""}
    ${pushupAttemptsListHtml(entry.attempts)}
    <form class="entry-form pushup-form">
      <div class="field">
        <label>Reps</label>
        <input type="number" class="reps-input" min="0" value="0" inputmode="numeric">
      </div>
      <button type="submit">${hasAttempts ? "Add another set" : "Save"}</button>
    </form>
    <div class="status" data-role="form-status"></div>
  `;
}

function wirePushupDayEditor(container, id, onChange) {
  const statusEl = container.querySelector('[data-role="form-status"]');

  const form = container.querySelector(".pushup-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const reps = parseInt(container.querySelector(".reps-input").value, 10) || 0;

      if (reps <= 0) {
        statusEl.textContent = "Enter a rep count greater than 0.";
        statusEl.classList.add("error");
        return;
      }

      statusEl.textContent = "Saving...";
      statusEl.classList.remove("error");
      try {
        await addPushupAttempt(id, reps);
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to save: " + err.message;
        statusEl.classList.add("error");
      }
    });
  }

  container.querySelectorAll(".remove-pushup").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await removePushupAttempt(id, parseInt(btn.dataset.index, 10));
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to remove: " + err.message;
        statusEl.classList.add("error");
      }
    });
  });
}

const pushupTodayDateLabel = document.getElementById("pushup-today-date-label");
const pushupTodayContent = document.getElementById("pushup-today-content");
pushupTodayDateLabel.textContent = formatLongDate(today);

function renderPushupToday() {
  const entry = pushupCache[todayId] || { total: 0, attempts: [] };
  pushupTodayContent.innerHTML = pushupDayEditorHtml(entry);
  wirePushupDayEditor(pushupTodayContent, todayId, refreshPushups);
}

function refreshPushups() {
  renderPushupToday();
  renderPushupCalendar();
  renderPushupLeaderboard();
}

function attemptsListHtml(attempts) {
  if (!attempts.length) return "";
  return `
    <ul class="attempts-list">
      ${attempts.map((a, i) => `
        <li>
          <span>${formatSeconds(a.seconds)}</span>
          <button type="button" class="remove-attempt" data-index="${i}" aria-label="Remove attempt">&times;</button>
        </li>
      `).join("")}
    </ul>
  `;
}

function dayEditorHtml(entry, { skipLabel }) {
  const hasAttempts = entry.attempts.length > 0;
  return `
    ${hasAttempts ? `
      <div class="today-result">
        <div class="time">${formatSeconds(entry.seconds)}</div>
        <div class="label">best today</div>
      </div>
    ` : ""}
    ${entry.skipped ? `<div class="time skip">No plank logged</div>` : ""}
    ${attemptsListHtml(entry.attempts)}
    <form class="entry-form day-form">
      <div class="field">
        <label>Minutes</label>
        <input type="number" class="mins-input" min="0" value="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>Seconds</label>
        <input type="number" class="secs-input" min="0" max="59" value="0" inputmode="numeric">
      </div>
      <button type="submit">${hasAttempts ? "Add another" : "Save"}</button>
    </form>
    <div class="status" data-role="form-status"></div>
    ${!hasAttempts ? `<button type="button" class="secondary skip-btn" style="margin-top:10px;">${skipLabel}</button>` : ""}
  `;
}

function wireDayEditor(container, id, onChange) {
  const statusEl = container.querySelector('[data-role="form-status"]');

  const form = container.querySelector(".day-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const mins = parseInt(container.querySelector(".mins-input").value, 10) || 0;
      const secs = parseInt(container.querySelector(".secs-input").value, 10) || 0;
      const totalSeconds = mins * 60 + secs;

      if (totalSeconds <= 0) {
        statusEl.textContent = "Enter a time greater than 0.";
        statusEl.classList.add("error");
        return;
      }

      statusEl.textContent = "Saving...";
      statusEl.classList.remove("error");
      try {
        await addAttempt(id, totalSeconds);
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to save: " + err.message;
        statusEl.classList.add("error");
      }
    });
  }

  container.querySelectorAll(".remove-attempt").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await removeAttempt(id, parseInt(btn.dataset.index, 10));
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to remove: " + err.message;
        statusEl.classList.add("error");
      }
    });
  });

  const skipBtn = container.querySelector(".skip-btn");
  if (skipBtn) {
    skipBtn.addEventListener("click", async () => {
      statusEl.textContent = "Saving...";
      statusEl.classList.remove("error");
      try {
        await markSkipped(id);
        onChange();
      } catch (err) {
        statusEl.textContent = "Failed to save: " + err.message;
        statusEl.classList.add("error");
      }
    });
  }
}

function refreshAll() {
  renderTodayCard();
  renderCalendar();
  renderStreaks();
  renderLeaderboard();
}

function renderTodayCard() {
  const entry = entriesCache[todayId] || { seconds: 0, skipped: false, attempts: [] };
  todayContent.innerHTML = dayEditorHtml(entry, { skipLabel: "Didn't do a plank today" });
  wireDayEditor(todayContent, todayId, refreshAll);
}

// --- Calendar ---
const monthLabel = document.getElementById("month-label");
const calendarGrid = document.getElementById("calendar-grid");
const prevMonthBtn = document.getElementById("prev-month");
const nextMonthBtn = document.getElementById("next-month");
const modalBackdrop = document.getElementById("modal-backdrop");
const modalDate = document.getElementById("modal-date");
const modalBody = document.getElementById("modal-body");
document.getElementById("modal-close").addEventListener("click", () => modalBackdrop.classList.add("hidden"));
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.add("hidden"); });

let viewYear = today.getFullYear();
let viewMonth = today.getMonth(); // 0-indexed

const DOW = ["S", "M", "T", "W", "T", "F", "S"];

function renderCalendar() {
  monthLabel.textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

  calendarGrid.innerHTML = "";
  DOW.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    calendarGrid.appendChild(el);
  });

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    calendarGrid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(viewYear, viewMonth, day);
    const id = dateId(date);
    const el = document.createElement("div");
    el.className = "day";
    if (id === todayId) el.classList.add("is-today");
    const entry = entriesCache[id];
    if (entry) el.classList.add(entry.skipped ? "skipped" : "has-entry");
    el.textContent = day;
    el.addEventListener("click", () => openDayModal("plank", date, id));
    calendarGrid.appendChild(el);
  }
}

function openDayModal(kind, date, id) {
  modalDate.textContent = formatLongDate(date);

  if (id > todayId) {
    modalBody.innerHTML = `<div class="status">Can't log entries for a future date.</div>`;
    modalBackdrop.classList.remove("hidden");
    return;
  }

  if (kind === "plank") {
    const entry = entriesCache[id] || { seconds: 0, skipped: false, attempts: [] };
    modalBody.innerHTML = dayEditorHtml(entry, { skipLabel: "No plank this day" });
    wireDayEditor(modalBody, id, () => {
      refreshAll();
      openDayModal("plank", date, id);
    });
  } else {
    const entry = pushupCache[id] || { total: 0, attempts: [] };
    modalBody.innerHTML = pushupDayEditorHtml(entry);
    wirePushupDayEditor(modalBody, id, () => {
      refreshPushups();
      openDayModal("pushup", date, id);
    });
  }

  modalBackdrop.classList.remove("hidden");
}

prevMonthBtn.addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});
nextMonthBtn.addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

// --- Pushup calendar ---
const pushupMonthLabel = document.getElementById("pushup-month-label");
const pushupCalendarGrid = document.getElementById("pushup-calendar-grid");
const pushupPrevMonthBtn = document.getElementById("pushup-prev-month");
const pushupNextMonthBtn = document.getElementById("pushup-next-month");

let pushupViewYear = today.getFullYear();
let pushupViewMonth = today.getMonth();

function renderPushupCalendar() {
  pushupMonthLabel.textContent = new Date(pushupViewYear, pushupViewMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });

  pushupCalendarGrid.innerHTML = "";
  DOW.forEach((d) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    pushupCalendarGrid.appendChild(el);
  });

  const firstDay = new Date(pushupViewYear, pushupViewMonth, 1).getDay();
  const daysInMonth = new Date(pushupViewYear, pushupViewMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    pushupCalendarGrid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(pushupViewYear, pushupViewMonth, day);
    const id = dateId(date);
    const el = document.createElement("div");
    el.className = "day";
    if (id === todayId) el.classList.add("is-today");
    const entry = pushupCache[id];
    if (entry && entry.total > 0) el.classList.add("has-entry");
    el.textContent = day;
    el.addEventListener("click", () => openDayModal("pushup", date, id));
    pushupCalendarGrid.appendChild(el);
  }
}

pushupPrevMonthBtn.addEventListener("click", () => {
  pushupViewMonth--;
  if (pushupViewMonth < 0) { pushupViewMonth = 11; pushupViewYear--; }
  renderPushupCalendar();
});
pushupNextMonthBtn.addEventListener("click", () => {
  pushupViewMonth++;
  if (pushupViewMonth > 11) { pushupViewMonth = 0; pushupViewYear++; }
  renderPushupCalendar();
});

// --- Toolbar ---
document.getElementById("toolbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-section]");
  if (!btn) return;
  document.querySelectorAll("#toolbar button").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll("[data-section-panel]").forEach((panel) => {
    panel.classList.toggle("hidden", panel.dataset.sectionPanel !== btn.dataset.section);
  });
});

// --- Boot ---
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    await Promise.all([fetchAllEntries(), fetchAllPushups()]);
    refreshAll();
    refreshPushups();
  } catch (err) {
    todayContent.innerHTML = `<div class="status error">Could not load entries: ${err.message}</div>`;
  }
});

signInAnonymously(auth).catch((err) => {
  todayContent.innerHTML = `<div class="status error">Sign-in failed: ${err.message}</div>`;
});
</script>
</body>
</html>
